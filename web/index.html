<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BIS Assistant (MVP)</title>
<style>body{font-family:system-ui;margin:0;background:#f6f7f9}header{background:#1a3a5f;color:#fff;padding:12px 16px}
main{max-width:760px;margin:0 auto;padding:16px}#log{border:1px solid #ddd;background:#fff;border-radius:8px;padding:12px;min-height:300px;white-space:pre-wrap}
.row{display:flex;gap:8px;margin-top:12px}input{flex:1;padding:10px;border-radius:8px;border:1px solid #ccc}
button{padding:10px 16px;border-radius:8px;border:0;background:#1a3a5f;color:#fff}.src{font-size:12px;color:#555}</style>
</head><body><header><b>BIS Standards & Services Assistant</b> — MVP · sources: bis.gov.in Know-Your-Standard only</header>
<main><div id="log">Ask e.g. “steel water bottle which IS?” / “LED bulb CRS?” / “HUID verify?” (EN/हिंदी)</div>
<div class="row"><input id="q" placeholder="Type product or BIS question…"/><button onclick="send()">Ask</button></div>
<p class="src">Informational only — confirm IS/year/QCO with BIS before manufacture. <span id="st"></span></p></main>
<script>
async function send(){
  const q=document.getElementById('q').value.trim(); if(!q) return;
  const log=document.getElementById('log'); log.textContent+='\n\nYou: '+q+'\n…';
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});
    const j=await r.json(); log.textContent+='\nAssistant:\n'+(j.text||JSON.stringify(j));
  }catch(e){ log.textContent+='\n[API not running: start `python -m bis_assistant.api` on :8000 and serve this file alongside]'; }
  document.getElementById('q').value='';
}
</script></body></html>
