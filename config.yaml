# BIS Assistant — single config source (env overrides: BIS_<SECTION>_<KEY>).
# Threshold changes require re-running the eval gate (plan §4, §8).
retrieval:
  direct_score: 15.0
  direct_margin: 5.0
  clarify_floor: 6.0
  max_rounds: 2
  max_questions_per_turn: 2
  scorer: keyword        # keyword | bm25 (Phase 2)
  kb_backend: json       # json | sqlite (Phase 1)

privacy:
  thread_ttl_days: 7
  retention_days: 90
  consent_valid_days: 365
  erasure_sla_hours: 24

api:
  port: 8000
  anon_per_hour: 30
  anon_burst_per_min: 5
  registered_per_hour: 300
  cors_allow_origins: ["http://127.0.0.1:5173", "http://localhost:5173"]

ingest:
  crawl_delay_s: 2.0
  live_crawl_enabled: false   # fixtures only until Phase 1 review
  refresh_days: 7
  staleness_alert_days: 14

observability:
  trace_sample_rate: 0.05
  trace_retention_days: 14
  latency_p95_ms: 2000
