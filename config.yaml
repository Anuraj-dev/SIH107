# BIS Assistant — single config source (env overrides: BIS_<SECTION>_<KEY>).
# Threshold changes require re-running the eval gate (plan §4, §8).
# Grounded/fusion floors moved here from hardcoded gates (issue #4 P0-2).
retrieval:
  direct_score: 15.0
  direct_margin: 5.0
  clarify_floor: 6.0
  weak_floor: 3.0
  max_rounds: 2
  max_questions_per_turn: 2
  grounded_score: 10.0       # curated "has a candidate" floor (BIS_RETRIEVAL_GROUNDED_SCORE)
  fusion_strong_score: 15.0  # metadata citations fused into corpus answers above this
  scorer: keyword        # keyword | bm25 (Phase 2)
  kb_backend: json       # json | sqlite (Phase 1)

catalogue:
  enabled: true          # BIS_CATALOGUE_ENABLED — 24k fallback, independent of rag.enabled

privacy:
  thread_ttl_days: 7
  retention_days: 90
  consent_valid_days: 365
  erasure_sla_hours: 24

api:
  port: 8000
  anon_per_hour: 30
  anon_burst_per_min: 5
  registered_per_hour: 300
  cors_allow_origins: ["http://127.0.0.1:5173", "http://localhost:5173"]

ingest:
  crawl_delay_s: 2.0
  live_crawl_enabled: false   # fixtures only until Phase 1 review
  refresh_days: 7
  staleness_alert_days: 14

observability:
  trace_sample_rate: 0.05
  trace_retention_days: 14
  latency_p95_ms: 2000

rag:
  enabled: false        # BIS_RAG_ENABLED=1 to serve corpus answers in /chat
  db_path: kb/bis_rag.db  # BIS_RAG_DB_PATH
  top_k: 5              # BIS_RAG_TOP_K
  semantic: true        # BIS_RAG_SEMANTIC — semantic rerank channel
  embedding_model: ""   # BIS_RAG_EMBEDDING_MODEL — optional sentence-transformers name
  weight_lexical: 1.0
  weight_semantic: 0.3
  exact_boost: 50.0     # exact IS-number/designation boost
  catalogue: true       # legacy alias of catalogue.enabled (BIS_RAG_CATALOGUE)
  min_overlap: 3        # BIS_RAG_MIN_OVERLAP — corpus relevance token floor
  min_lexical: 15.0     # BIS_RAG_MIN_LEXICAL — corpus relevance lexical floor
  catalogue_min_score: 8.0  # BIS_RAG_CATALOGUE_MIN_SCORE — pre-clarification bar

llm:
  provider: openai-compatible  # BIS_LLM_PROVIDER — openai-compatible | gemini | ollama
  model: ""             # BIS_LLM_MODEL, e.g. gpt-4o-mini / gemini-2.0-flash / llama3 (empty = extractive fallback)
  api_key: ""           # BIS_LLM_API_KEY (never commit; env only; not needed for ollama)
  base_url: https://api.openai.com/v1  # BIS_LLM_BASE_URL (ollama default http://localhost:11434)
  temperature: 0.2
  max_tokens: 512
  timeout_s: 20.0
  retries: 1            # BIS_LLM_RETRIES — extra attempts on transport failure

memory:
  expand_turns: 2       # BIS_MEMORY_EXPAND_TURNS — history turns feeding retrieval
  expand_terms: 6       # BIS_MEMORY_EXPAND_TERMS — new terms carried over, max
  expand_chars: 200     # BIS_MEMORY_EXPAND_CHARS — added-character budget

guidance:
  adaptive: true        # BIS_GUIDANCE_ADAPTIVE — user-tailored certification next steps
